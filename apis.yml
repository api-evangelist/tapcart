aid: tapcart
name: Tapcart
description: 'Tapcart is a mobile commerce platform for Shopify merchants, turning a
  Shopify storefront into a native iOS and Android shopping app. Beyond the no-code
  app builder, Tapcart ships a developer platform: App Studio, a React-based custom
  block and component framework; a public Development API at api.tapcart.com for
  creating, versioning and publishing App Studio components, block templates,
  dependencies and layouts; an Insights (metrics) API for app analytics; a clickstream
  webhook that streams shopper behavioral events to merchant endpoints; a first-party
  CLI (@tapcart/tapcart-cli) with a bundled MCP server; and published AI agent skills
  for driving that CLI from Claude Code, Cursor or Windsurf.'
