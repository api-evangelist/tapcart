apis:
- aid: tapcart:insights-metrics-api
  name: Tapcart Insights Metrics API
  description: >-
    The Insights (Insights Pro) Metrics API returns aggregated analytics for a Tapcart app from a single
    POST endpoint whose response shape varies by the requested metricType — push explorer, sessions, revenue,
    and other app performance metrics — over a date range with configurable timezone and granularity.
    Authenticated with a static api-key header plus an app-id header.
  humanURL: https://dev.tapcart.com/reference/insights-api
  baseURL: https://api.tapcart.com/insights-pro/v2
  tags:
  - Analytics
  - Insights
  - Metrics
  - Push Notifications
  properties:
  - type: Documentation
    url: https://dev.tapcart.com/reference/insights-api
- aid: tapcart:clickstream-webhook
  name: Tapcart Clickstream Webhook
  description: >-
    Tapcart's clickstream webhook delivers realtime shopper behavioral events from the mobile app to an
    HTTPS endpoint the merchant configures in the Tapcart dashboard. Fifteen event types are eligible
    for delivery, from applicationInstalled and pageView through cartAdd, checkoutCreated and purchaseCompleted,
    each carrying a shared device/session properties envelope and deduplication identifiers.
  humanURL: https://dev.tapcart.com/reference/clickstream
  baseURL: https://dev.tapcart.com/reference/clickstream
  tags:
  - Webhook
  - Event
  - Clickstream
  - Analytics
  tags_raw:
  - Webhooks
  - Events
  - Clickstream
  - Analytics
  properties:
  - type: Webhooks
    url: asyncapi/tapcart-webhooks.yml
  - type: Documentation
    url: https://dev.tapcart.com/reference/clickstream
