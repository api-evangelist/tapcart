versioning_model:
  description: >-
    Components and BlockTemplates are versioned server-side. A push stores a
    new version as a draft; a separate versions operation sets the active
    versionIndex to promote it live. The versions collection is addressable
    (GET .../versions) for components; for block templates the by-id read
    returns the version selected by versionIndex.
  operations:
    - "GET /client/{appId}/components/{componentKey}/versions"
    - "PUT /client/{appId}/components/{componentKey}/versions"
    - "PUT /client/{appId}/blockTemplates/{blockTemplateId}/versions"
gaps:
  - >-
    The App Studio Component resource — the thing the /client/components
    operations create, update and read — has no schema in components.schemas.
    Its shape (owner, label, key, code, forceUpdate) is visible only in the
    inline request body.
  - >-
    Layout.blocks and LayoutTemplate.blocks are untyped object arrays with no
    $ref, so the layout-to-block relationship is not machine-derivable from the
    schema alone.
  - Page.data is polymorphic with no discriminator.
  - No response schema is declared on any error response.
