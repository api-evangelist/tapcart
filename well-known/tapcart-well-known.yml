method: searched
description: >-
  Results of probing the /.well-known/ discovery surface for every host in
  apis.yml (Website, DeveloperPortal, baseURL) and the OpenAPI servers[] host
  (https://api.tapcart.com), plus the security subdomain. Status is the HTTP
  code observed at fetch time on 2026-08-05. The only document served is
  security.txt, and it is NOT on the apex or the API host — it is on
  security.tapcart.com, a Google Cloud Storage bucket (tapcart-vulnerability-program)
  fronted by Cloudflare. www.tapcart.com, dev.tapcart.com and api.tapcart.com all
  answer 404 for every /.well-known/ path probed, so a client following RFC 9116
  against the primary domain would not find Tapcart's security contact.
hosts:
