findings:
  - >-
    The Tapcart OpenAPI declares zero operationIds across 14 operations. This
    costs the spec on contract-quality scoring and forces every downstream
    binding (this crosswalk, Arazzo workflows, generated SDKs) to address
    operations by method+path. Adding stable operationIds is the single
    cheapest improvement available to this spec.
  - >-
    Only one of Tapcart's two registered OpenAPI documents is published to the
    developer portal. The ReadMe project registers both tapcart-client-api.json
    (captured here) and tapcart-api-services.json, but the latter has no
    published reference pages — its push-notification operations are visible
    only as a schema-validation warning in the portal's own payload.
