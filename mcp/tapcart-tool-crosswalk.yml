    title: Tapcart @tapcart/app-pages API
    version: 1.0.0
    server: https://api.tapcart.com/
    operations: 14
    operation_ids_declared: 0
    gated: false
  mcp:
    file: mcp/tapcart-mcp.yml
    transport: stdio
    tools: 39
    gated: true
    gate: >-
      Local stdio process requiring Auth0 credentials in ~/.tapcart/auth.json
      and a Tapcart Enterprise plan; tools/list could not be introspected over
      the network, so bindings below are by name/semantics from the published
      docs.
  graphql:
    present: false
crosswalk:
  - tool: tapcart_components_listRemote
    category: components
    rest: ["GET /client/{appId}/components"]
    binding: rest
    confidence: high
    note: Docs describe it as "List remote components for the configured appId" — the single spec operation with that shape.
  - tool: tapcart_components_pull
    category: components
    rest: ["GET /client/{appId}/components/{componentKey}", "GET /client/{appId}/components"]
    binding: rest
    confidence: medium
    note: Pull one/all; fans out to the by-key read for a single component and the list read for all. Writes the result to ./components locally.
  - tool: tapcart_components_push
    category: components
    rest: ["POST /client/components", "PUT /client/components/{componentId}"]
    binding: rest
    confidence: high
    note: Mode-gated. The create operation upserts when forceUpdate is true, which matches the CLI's push semantics.
  - tool: tapcart_component_versions_list
    category: components
    rest: ["GET /client/{appId}/components/{componentKey}/versions"]
    binding: rest
    confidence: high
  - tool: tapcart_component_versions_set
    category: components
    rest: ["PUT /client/{appId}/components/{componentKey}/versions"]
    binding: rest
    confidence: high
    note: Mode-gated. Spec operation is "Update the version index of an App Studio Component".
  - tool: tapcart_blocks_listRemote
    category: blocks
    rest: ["GET /client/{appId}/blocks"]
    binding: rest
    confidence: high
    note: Spec operation returns all merchant-owned custom block templates for an app.
  - tool: tapcart_blocks_pull
    category: blocks
    rest: ["GET /client/{appId}/blockTemplates/{blockTemplateId}", "GET /client/{appId}/blocks"]
    binding: rest
    confidence: medium
    note: >-
      Pull one/all. The docs address blocks by label; the spec addresses them
      by blockTemplateId, so the CLI resolves label to id before the read.
  - tool: tapcart_blocks_push
    category: blocks
    rest: ["POST /client/blockTemplates", "PUT /client/blockTemplates/{blockTemplateId}"]
    binding: rest
    confidence: high
    note: Mode-gated.
  - tool: tapcart_block_versions_list
    category: blocks
    rest: ["GET /client/{appId}/blockTemplates/{blockTemplateId}"]
    binding: rest
    confidence: medium
    note: >-
      The spec exposes no dedicated block-template version-list operation; the
      by-id read returns the template with the version selected by
      versionIndex, which is the closest published surface.
  - tool: tapcart_block_versions_set
    category: blocks
    rest: ["PUT /client/{appId}/blockTemplates/{blockTemplateId}/versions"]
    binding: rest
    confidence: high
    note: Mode-gated. Spec operation updates versionIndex on an existing BlockTemplate.
  - tool: tapcart_dependencies_pullRemote
