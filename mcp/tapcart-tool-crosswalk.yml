rest_only:
  - capability: layouts
    operations: ["GET /client/{appId}/layouts"]
    note: >-
      The API can list an app's layouts, but every MCP layout tool works on
      local files under .tapcart/layouts — there is no tool that reads the
      remote layout list.
  - capability: components
    operations: ["PUT /client/components/{componentId}"]
    note: >-
      Direct update-by-componentId. The CLI push path is documented against the
      create/upsert operation, so this operation has no distinct tool.
