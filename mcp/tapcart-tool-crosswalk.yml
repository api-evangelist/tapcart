description: >-
  Binds each published Tapcart MCP tool to the OpenAPI operation(s) that back
  it, so an agent tool inherits a real input contract from the spec instead of
  a guessed one. Two caveats are load-bearing and are recorded rather than
  papered over. First, the Tapcart OpenAPI declares NO operationId on any of
  its 14 operations, so REST operations are referenced here by
  "METHOD /path" — the crosswalk cannot use operationIds because the provider
  does not publish them. Second, the MCP server is the Tapcart CLI, not a thin
  REST proxy: a large share of its tools operate purely on local files
  (layouts, scaffolding, lint, logs, types) and never touch the HTTP API at
  all. Those are recorded in local_only[] rather than mcp_only[], because they
  are not a hidden remote capability — they are a local developer surface that
  has no API equivalent by design.
